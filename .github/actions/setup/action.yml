name: Setup
description: pnpm (version from package.json) + Node 22 + cached install
runs:
  using: composite
  steps:
    # No `version:` — pnpm/action-setup reads `packageManager` from
    # package.json; passing both fails the job when they differ.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
