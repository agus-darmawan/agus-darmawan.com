# Weekly dependency updates. Patch and minor npm updates (and GitHub Actions
# updates) merge themselves once CI passes; major npm updates wait for a
# review. See workflows/dependabot-auto-merge.yml.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Makassar
    # Hijacked releases are usually caught within days; let new versions age
    # before they are proposed (and auto-merged).
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Packages that have to move together get one PR, whatever the bump.
      next:
        patterns: ["next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      # Everything else: one PR for all patch and minor updates of the week.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Makassar
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # The Spotify worker has no lockfile and CI doesn't build it, so only
  # majors are proposed, and those always wait for a review.
  - package-ecosystem: npm
    directory: /workers/spotify-proxy
    schedule:
      interval: monthly
      timezone: Asia/Makassar
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      worker:
        patterns: ["*"]
